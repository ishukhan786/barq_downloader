<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BARQ Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg class="bolt-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">BARQ <span class="brand-urdu">برق</span></div>
          <div class="brand-tagline">Speed at Every Click.</div>
        </div>
      </div>
      <div id="status-pill" class="status-pill status-checking">
        <span class="status-dot"></span>
        <span id="status-text">Checking...</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <div class="form-group">
        <label for="url-input" class="label">Download URL</label>
        <div class="input-wrapper">
          <input type="text" id="url-input" class="input" placeholder="https://example.com/file.zip" spellcheck="false" autocomplete="off" />
        </div>
      </div>

      <div class="form-group">
        <label for="filename-input" class="label">Filename Hint <span class="optional">(Optional)</span></label>
        <div class="input-wrapper">
          <input type="text" id="filename-input" class="input" placeholder="e.g. document.pdf" spellcheck="false" />
        </div>
      </div>

      <div id="feedback" class="feedback hidden"></div>

      <div class="actions">
        <button id="btn-download" class="btn btn-primary" disabled>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Download with BARQ
        </button>
        <button id="btn-retry" class="btn btn-secondary hidden">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
          Retry Connection
        </button>
      </div>
    </main>

    <!-- Footer Guide -->
    <footer class="footer">
      <div id="setup-hint" class="setup-hint hidden">
        <span>⚠️ BARQ app is not reachable. Ensure BARQ Downloader is running on Windows.</span>
      </div>
      <div class="version">v0.1.0 • Windows x64</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
