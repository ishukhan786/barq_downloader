  <text x="350" y="196" font-family="'Segoe UI Variable Display','Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="128" font-weight="800" letter-spacing="10" fill="#f2f4f6">BARQ</text>
  <text x="770" y="190" font-family="'Segoe UI','Noto Naskh Arabic','Tahoma',sans-serif" font-size="88" font-weight="700" fill="#00e09a">برق</text>
  <text x="354" y="250" font-family="'Segoe UI Variable Text','Segoe UI','Inter',Arial,sans-serif" font-size="30" font-weight="500" letter-spacing="6" fill="#8b939c">SPEED AT EVERY CLICK.</text>
