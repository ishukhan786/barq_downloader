      <stop offset="0" stop-color="#1b1f25"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <linearGradient id="l-bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5cffc4"/>
      <stop offset="0.45" stop-color="#00e09a"/>
      <stop offset="1" stop-color="#00a874"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="320" rx="36" fill="#0d0f12"/>
  <g transform="translate(40 40) scale(0.46875)">
